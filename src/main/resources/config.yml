# ============================================================================
#  SentinelAC 2 — серверный античит для Paper 1.21.11
#
#  Проверки движения и боя опираются на пакет client_tick_end, который клиент
#  1.21.2+ отправляет в конце КАЖДОГО своего тика. Поэтому сервер видит точный
#  порядок действий внутри одного тика клиента и пофизически сверяет движение.
#  Клиенты, которые не шлют этот пакет (старые версии через ViaVersion),
#  проверками движения, таймера, AutoSwap, MultiAura и NoSwing не проверяются —
#  чтобы не было ложных срабатываний.
# ============================================================================

# enforce — отменять удары/блоки, откатывать движение и кикать по порогам.
# monitor — только уведомления (удобно первые дни после установки, чтобы
#           подобрать пороги под ваш сервер).
mode: enforce

alerts:
  # Минимальный интервал между уведомлениями одной проверки по одному игроку (мс).
  cooldown-ms: 1000
  # Дублировать уведомления в консоль.
  console: true

violation-decay:
  # Как часто накопленные очки нарушений (VL) уменьшаются.
  interval-ticks: 600
  # Множитель при каждом уменьшении (0.85 = -15%).
  factor: 0.85

# Сколько клиентских тиков сверх пинга игрока прощать движение после отбрасывания
# (удар, взрыв, заряд ветра, удочка).
velocity-extra-ticks: 4

# Общие параметры каждой проверки:
#   enabled      — включена ли проверка
#   buffer       — сколько подозрительных событий подряд нужно для срабатывания
#   buffer-decay — насколько буфер уменьшается на каждом чистом событии
#   vl           — сколько очков нарушения добавляет одно срабатывание
#   kick-vl      — кик при достижении этого VL (0 = никогда не кикать)
#   mitigate     — отменять удар/блок или откатывать игрока на последнюю чистую позицию
checks:
  autoswap:
    # Смена слота ПОСЛЕ удара в том же тике клиента. Обычный клиент так не умеет:
    # он отправляет смену слота до удара. Это подпись макросов auto attribute swap.
    enabled: true
    buffer: 1.0
    buffer-decay: 0.0
    vl: 2.0
    kick-vl: 6.0
    mitigate: true
    # После срабатывания столько секунд отменяются удары, перед которыми в том же
    # тике менялся слот, — макрос перестаёт давать преимущество.
    penalty-seconds: 15.0
  multiaura:
    # Удар по двум разным целям в одном тике клиента (обычный клиент бьёт одну цель за тик).
    enabled: true
    buffer: 1.0
    buffer-decay: 0.0
    vl: 2.0
    kick-vl: 8.0
    mitigate: true
  noswing:
    # Удар без пакета взмаха руки в том же тике.
    enabled: true
    buffer: 3.0
    buffer-decay: 0.5
    vl: 1.0
    kick-vl: 10.0
    mitigate: true
  reach:
    # Дистанция от глаз до хитбокса цели больше атрибута entity_interaction_range.
    # Для целей-игроков используется история позиций за время пинга атакующего.
    enabled: true
    buffer: 2.0
    buffer-decay: 0.25
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    tolerance: 0.1
    hitbox-margin: 0.1
    # Дополнительные серверные тики истории сверх пинга (интерполяция клиента).
    extra-ticks: 4.0
  fly:
    # Вертикальное движение сверяется с гравитацией тик за тиком (зависание, полёт, прыжок в воздухе).
    enabled: true
    buffer: 3.0
    buffer-decay: 0.1
    vl: 1.0
    kick-vl: 20.0
    mitigate: true
    tolerance: 0.03
  speed:
    # Горизонтальная скорость сверяется с трением, ускорением и атрибутом скорости.
    enabled: true
    buffer: 4.0
    buffer-decay: 0.05
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    tolerance: 0.025
  noslow:
    # Нет замедления при еде, натяжении лука, блоке щитом.
    enabled: true
    buffer: 5.0
    buffer-decay: 0.1
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    tolerance: 0.025
    min-use-ticks: 3.0
  timer:
    # Клиент шлёт тики быстрее 20 в секунду.
    enabled: true
    buffer: 1.0
    buffer-decay: 0.0
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    # На сколько миллисекунд клиент может опередить реальное время.
    threshold-ms: 200.0
    # Сколько отставания (лага сети) засчитывается в долг, который потом можно «догнать».
    max-lag-ms: 1000.0
  badpackets:
    enabled: true
    buffer: 1.0
    buffer-decay: 0.0
    vl: 2.0
    kick-vl: 6.0
    mitigate: true
  blockreach:
    # Дистанция от глаз до блока, по которому кликнули, больше block_interaction_range.
    enabled: true
    buffer: 2.0
    buffer-decay: 0.25
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    tolerance: 0.25
  airplace:
    enabled: true
    buffer: 2.0
    buffer-decay: 0.25
    vl: 2.0
    kick-vl: 8.0
    mitigate: true
  scaffold:
    # Блок прямо под ноги, а взгляд почти горизонтально или вверх.
    enabled: true
    buffer: 3.0
    buffer-decay: 0.25
    vl: 1.0
    kick-vl: 0.0
    mitigate: true
    max-pitch: 30.0
