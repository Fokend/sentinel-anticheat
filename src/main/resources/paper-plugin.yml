name: SentinelAC
version: '${version}'
main: dev.fokend.sentinel.SentinelPlugin
api-version: '1.21.11'
authors: [ fokend ]
description: Серверный античит Paper 1.21.11 — AutoSwap, MultiAura, NoSwing, Reach, Fly, Speed, NoSlow, Timer, BlockReach, AirPlace, Scaffold.

permissions:
  sentinel.bypass:
    description: Игнорирование всех проверок античита
    default: op
  sentinel.alerts:
    description: Получение уведомлений и просмотр профилей
    default: op
  sentinel.admin:
    description: Перезагрузка конфигурации
    default: op
